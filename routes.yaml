# routerai routing policy
#
# Each "tier" maps a quality-tier / model-hint to an ordered list of candidate
# models. The router picks the CHEAPEST candidate whose tier matches the request,
# then (in shadow mode) checks that the cheap route still clears the quality bar.
#
# cost is expressed in USD per 1K tokens, as a single blended rate applied to
# prompt + completion tokens (rough list-price approximations; override freely
# for your own contracts and input/output mix).
#
# Every model names the provider that serves it. The router only picks a
# candidate whose provider is enabled (ROUTERAI_PROVIDER), so a stub or Claude
# model id is never sent to OpenAI and vice versa.
#
# The `baseline` model is what a naive "always use the premium model" setup would
# have used — used to compute estimated savings on /metrics.

baseline: gpt-4o

# Minimum eval score (0.0 - 1.0) a cheap route must clear to be considered
# "quality-passing". Below this, the decision log flags a potential regression.
quality_bar: 0.5

# Fraction of requests to shadow-evaluate (1.0 = every request). v0.1 evaluates
# all requests for a rich demo; lower this in production.
shadow_sample_rate: 1.0

models:
  # name: {provider, cost per 1K tokens (USD)}
  gpt-4o:            {provider: openai,    cost: 0.0050}
  gpt-4o-mini:       {provider: openai,    cost: 0.0003}
  # Claude: blended 1:1 from $/MTok list prices (in/out) — Haiku 4.5 $1/$5,
  # Sonnet 5.5 $2/$10, Opus 5.5 $4/$20.
  claude-haiku-4-5:  {provider: anthropic, cost: 0.0030}
  claude-sonnet-5-5: {provider: anthropic, cost: 0.0060}
  claude-opus-5-5:   {provider: anthropic, cost: 0.0120}
  stub-small:        {provider: stub,      cost: 0.0002}
  stub-large:        {provider: stub,      cost: 0.0040}

# quality tier -> candidate models (router picks the cheapest one an enabled
# provider can serve)
tiers:
  cheap:
    - stub-small
    - gpt-4o-mini
    - claude-haiku-4-5
  balanced:
    - stub-small
    - gpt-4o-mini
    - claude-haiku-4-5
  premium:
    - stub-large
    - claude-sonnet-5-5
    - gpt-4o

# fallback tier used when the request does not specify one (see routing.classify)
default_tier: balanced
